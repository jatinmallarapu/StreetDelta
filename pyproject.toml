[build-system]
requires=["setuptools>=77"]
build-backend="setuptools.build_meta"

[project]
name="streetdelta"
version="0.1.0"
requires-python=">=3.11"
dependencies=["numpy>=1.26,<3","scikit-learn>=1.5,<2","pyproj>=3.6,<4","fastapi>=0.115,<1","uvicorn>=0.34,<1","httpx>=0.28,<1","psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev=["pytest>=8,<10","ruff>=0.11,<1"]
ingest=["pyarrow>=19,<25"]
perception=["torch>=2.5,<3","transformers>=4.51,<5","Pillow>=11,<13"]
edge=["onnxruntime>=1.20,<2"]

[tool.setuptools.packages.find]
include=["streetdelta*"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
target-version="py311"
line-length=100
