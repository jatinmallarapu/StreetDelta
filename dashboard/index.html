<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreetDelta · Map review</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
<script src="/static/review.js" defer></script>
</head>
<body>
<header><div><h1>StreetDelta</h1><p>Chicago · Map change review</p></div><span id="mode">Connecting</span></header>
<main>
<section class="map-column" aria-label="Candidate map">
<div id="map"></div>
<div class="legend"><span class="dot changed"></span> Changed <span class="dot new"></span> New</div>
</section>
<aside>
<section class="pane">
<label for="type">Change type</label>
<select id="type"><option value="">All changes</option><option value="changed">Changed</option><option value="new">New</option></select>
<label for="confidence">Minimum confidence <output id="minimum">0%</output></label>
<input id="confidence" type="range" min="0" max="1" value="0" step="0.05">
<p id="status" role="status"></p>
</section>
<section id="detail" class="pane" hidden aria-label="Candidate evidence"></section>
<section class="pane"><h2>Ranked candidates</h2><div id="queue"></div></section>
</aside>
</main>
</body>
</html>
