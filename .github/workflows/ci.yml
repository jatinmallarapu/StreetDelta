# Verify geometry, API and persisted evidence in the actual PostGIS Compose stack.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: make test
      - run: make eval
      - run: docker compose up --build --detach
      - run: python scripts/check_compose.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
